[package]
name = "pv-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bytes = "1.12.1"
crossbeam-channel = "0.5.17"
image = { version = "0.25.10", default-features = false, features = ["webp", "png"] }
lru = "0.19.0"
parking_lot = "0.13.0"
pv-container = { version = "0.1.0", path = "../pv-container" }
pv-decode = { version = "0.1.0", path = "../pv-decode" }
pv-layout = { version = "0.1.0", path = "../pv-layout" }
pv-process = { version = "0.1.0", path = "../pv-process" }
pv-render = { version = "0.1.0", path = "../pv-render" }
serde = { version = "1.0.229", features = ["derive"] }
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
